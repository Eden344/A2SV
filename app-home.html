<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MenuMate · Home (App)</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="app-header" role="banner">
      <div class="bar container">
        <a class="brand" href="/app-home.html">
          <img src="/assets/logo.svg" alt="MenuMate logo" width="28" height="28">
          <span>MenuMate</span>
        </a>
        <div class="header-actions">
          <label class="visually-hidden" for="lang">Language</label>
          <select id="lang" class="lang-select" aria-label="Language selector">
            <option selected>English (EN)</option>
            <option>Amharic (አማርኛ)</option>
          </select>
        </div>
      </div>
    </header>

    <main id="main" class="container flow">
      <section aria-labelledby="welcome">
        <h1 id="welcome">Welcome back</h1>
        <form class="search-bar" action="/restaurants.html" method="get">
          <div class="search-row">
            <div class="field">
              <label class="label" for="q">Search dishes or restaurants</label>
              <input class="input" id="q" name="q" type="search" placeholder="Try 'Injera with Tibs'">
            </div>
            <div class="field">
              <label class="label" for="loc">Location</label>
              <input class="input" id="loc" name="loc" type="text" placeholder="Addis Ababa">
            </div>
          </div>
          <div class="chips mt-3">
            <button class="btn btn-ghost" type="button" title="Static demo">Use my location</button>
            <button class="btn btn-primary" type="submit">Search</button>
          </div>
        </form>
      </section>

      <section aria-labelledby="categories">
        <h2 id="categories">Food Categories</h2>
        <div class="chips">
          <a class="chip" href="/restaurants.html">Fasting</a>
          <a class="chip" href="/restaurants.html">Non-Fasting</a>
          <a class="chip" href="/restaurants.html">Baked Goods</a>
          <a class="chip" href="/restaurants.html">Popular</a>
        </div>
      </section>

      <section aria-labelledby="nearby">
        <h2 id="nearby">Nearby Restaurants</h2>
        <div class="grid cols-2">
          <article class="card">
            <a href="/restaurant.html"><img class="card-media cover" src="/assets/sample-restaurant.svg" alt="Kategna restaurant"></a>
            <div class="card-body">
              <h3 class="card-title"><a href="/restaurant.html">Kategna</a></h3>
              <p class="card-desc">Modern Ethiopian classics.</p>
            </div>
            <div class="card-meta"><span>4.5 ★</span><span>0.8 km</span></div>
          </article>
          <article class="card">
            <a href="/restaurant.html"><img class="card-media cover" src="/assets/sample-restaurant.svg" alt="Yod Abyssinia restaurant"></a>
            <div class="card-body">
              <h3 class="card-title"><a href="/restaurant.html">Yod Abyssinia</a></h3>
              <p class="card-desc">Live music, great food.</p>
            </div>
            <div class="card-meta"><span>4.6 ★</span><span>1.2 km</span></div>
          </article>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" role="navigation" aria-label="Primary">
      <div class="inner container">
        <a href="/app-home.html" aria-current="page">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg>
          <span class="visually-hidden">Home</span>
        </a>
        <a href="/restaurants.html">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v2H4zm2 4h12v12H6z"/></svg>
          <span class="visually-hidden">Restaurants</span>
        </a>
        <a href="/scan.html">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M4 7V5h5v2zm11 0V5h5v2zM4 19v-2h5v2zm11 0v-2h5v2zM7 9h10v6H7z"/></svg>
          <span class="visually-hidden">Scan</span>
        </a>
        <a href="/favorites.html">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21l-1.4-1.2C6 16 3 13.3 3 9.9A4.9 4.9 0 018 5c1.6 0 3 .8 4 2a5.1 5.1 0 014-2 4.9 4.9 0 015 4.9c0 3.4-3 6.1-7.6 9.9z"/></svg>
          <span class="visually-hidden">Favorites</span>
        </a>
        <a href="/profile.html">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z"/></svg>
          <span class="visually-hidden">Profile</span>
        </a>
      </div>
    </nav>

    <footer class="app-footer" role="contentinfo">
      <nav class="inner container" aria-label="Footer">
        <a href="/index.html">About</a>
        <a href="#" aria-disabled="true" tabindex="-1">Privacy</a>
        <a href="#" aria-disabled="true" tabindex="-1">Terms</a>
      </nav>
    </footer>
  </body>
</html>
