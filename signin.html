<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MenuMate · Sign in</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="app-header" role="banner">
      <div class="bar container">
        <a class="brand" href="/index.html">
          <img src="/assets/logo.svg" alt="MenuMate logo" width="28" height="28">
          <span>MenuMate</span>
        </a>
        <div class="header-actions">
          <label class="visually-hidden" for="lang">Language</label>
          <select id="lang" class="lang-select" aria-label="Language selector">
            <option selected>English (EN)</option>
            <option>Amharic (አማርኛ)</option>
          </select>
        </div>
      </div>
    </header>

    <main id="main" class="container flow">
      <h1>Sign in</h1>
      <form class="grid" action="/app-home.html" method="get" aria-describedby="signin-note">
        <div class="field">
          <label class="label" for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required>
          <p class="help">Use a valid email address.</p>
        </div>
        <div class="field">
          <label class="label" for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
          <p class="help">At least 8 characters.</p>
        </div>
        <div class="grid" style="grid-template-columns: 1fr; gap: 12px;">
          <button class="btn btn-primary" type="submit">Sign in</button>
          <a class="btn btn-ghost" href="/forgot-password.html">Forgot password?</a>
        </div>
        <p id="signin-note" class="help">This is a static prototype. No data is stored.</p>
      </form>
      <p class="mt-4">New here? <a href="/signup.html">Create an account</a>.</p>
    </main>

    <footer class="app-footer" role="contentinfo">
      <nav class="inner container" aria-label="Footer">
        <a href="/index.html">About</a>
        <a href="#" aria-disabled="true" tabindex="-1">Privacy</a>
        <a href="#" aria-disabled="true" tabindex="-1">Terms</a>
      </nav>
    </footer>
  </body>
</html>
