<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MenuMate · Sign up</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="app-header" role="banner">
      <div class="bar container">
        <a class="brand" href="/index.html">
          <img src="/assets/logo.svg" alt="MenuMate logo" width="28" height="28">
          <span>MenuMate</span>
        </a>
        <div class="header-actions">
          <label class="visually-hidden" for="lang">Language</label>
          <select id="lang" class="lang-select" aria-label="Language selector">
            <option selected>English (EN)</option>
            <option>Amharic (አማርኛ)</option>
          </select>
        </div>
      </div>
    </header>

    <main id="main" class="container flow">
      <h1>Create your account</h1>
      <form class="grid" action="/app-home.html" method="get" aria-describedby="signup-note">
        <div class="field">
          <label class="label" for="name">Full name</label>
          <input class="input" id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label class="label" for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label class="label" for="phone">Phone number</label>
          <input class="input" id="phone" name="phone" type="tel" autocomplete="tel" placeholder="e.g., +251 9 12 34 56 78" required>
        </div>
        <div class="field">
          <label class="label" for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
          <p class="help">Use at least 8 characters.</p>
        </div>
        <div class="field">
          <label class="label" for="confirm">Confirm password</label>
          <input class="input" id="confirm" name="confirm" type="password" minlength="8" required>
        </div>
        <div class="field">
          <label class="label" for="agree">
            <input id="agree" name="agree" type="checkbox" required>
            I agree to the <a href="#" aria-disabled="true" tabindex="-1">Terms</a> and <a href="#" aria-disabled="true" tabindex="-1">Privacy</a>.
          </label>
        </div>
        <button class="btn btn-primary" type="submit">Create account</button>
        <p id="signup-note" class="help">This is a static prototype. No data is stored.</p>
      </form>
      <p class="mt-4">Already have an account? <a href="/signin.html">Sign in</a>.</p>
    </main>

    <footer class="app-footer" role="contentinfo">
      <nav class="inner container" aria-label="Footer">
        <a href="/index.html">About</a>
        <a href="#" aria-disabled="true" tabindex="-1">Privacy</a>
        <a href="#" aria-disabled="true" tabindex="-1">Terms</a>
      </nav>
    </footer>
  </body>
</html>
