<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MenuMate · Forgot password</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="app-header" role="banner">
      <div class="bar container">
        <a class="brand" href="/index.html">
          <img src="/assets/logo.svg" alt="MenuMate logo" width="28" height="28">
          <span>MenuMate</span>
        </a>
        <div class="header-actions">
          <label class="visually-hidden" for="lang">Language</label>
          <select id="lang" class="lang-select" aria-label="Language selector">
            <option selected>English (EN)</option>
            <option>Amharic (አማርኛ)</option>
          </select>
        </div>
      </div>
    </header>

    <main id="main" class="container flow">
      <h1>Reset your password</h1>
      <form class="grid" action="/signin.html" method="get" aria-describedby="reset-note">
        <div class="field">
          <label class="label" for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required>
          <p class="help">We'll send a reset link if this address exists.</p>
        </div>
        <button class="btn btn-primary" type="submit">Send reset link</button>
        <p id="reset-note" class="help">This is a static prototype. Email sending is not implemented.</p>
      </form>
      <p class="mt-4"><a href="/signin.html">Back to sign in</a></p>
    </main>

    <footer class="app-footer" role="contentinfo">
      <nav class="inner container" aria-label="Footer">
        <a href="/index.html">About</a>
        <a href="#" aria-disabled="true" tabindex="-1">Privacy</a>
        <a href="#" aria-disabled="true" tabindex="-1">Terms</a>
      </nav>
    </footer>
  </body>
</html>
